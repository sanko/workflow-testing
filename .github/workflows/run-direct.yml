name: Run Task on Hosted Runner

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      matrix:
        description: >
          JSON array of setups for this OS family. Item fields:
          platform_name (required), os (required), arch (required),
          toolchain, prepare, variant, perl_version, configure.
        required: true
        type: string
      task:
        description: >
          Command(s) executed on the runner. Defaults to the standard
          coverage build when omitted. Applies to every setup in the matrix.
        required: false
        type: string

jobs:
  run:
    name: ${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'a64') || (matrix.arch == 'riscv64' && 'r64') || matrix.arch }}-${{ matrix.toolchain }}${{ matrix.perl_version && format('-v{0}', matrix.perl_version) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      #~ Unique base name for this setup's result files
      FNAME: ${{ matrix.platform_name }}-${{ matrix.arch }}-${{ matrix.toolchain }}${{ matrix.perl_version && format('-v{0}', matrix.perl_version) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      - name: Setup MSVC
        if: matrix.toolchain == 'msvc'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Prepare environment
        if: matrix.prepare != ''
        shell: bash
        run: ${{ matrix.prepare }}

      #~ On Windows the git-bash MSYS2/Cygwin perl shadows Strawberry unless we
      #~ put Strawberry first. choco installs to C:\Strawberry; its bin dirs were
      #~ never added to PATH, so `perl` resolved to the MSYS build (which lacks
      #~ dual-life ExtUtils modules like ExtUtils::Manifest) and any cpanm run
      #~ under it died with a bogus "Can't locate <core module>". Prepend
      #~ Strawberry's dirs via GITHUB_PATH (which prepends) so the Run-task step
      #~ resolves perl/cpanm/gcc to Strawberry.
      - name: Force Strawberry Perl on PATH (Windows)
        if: runner.os == 'Windows' && matrix.perl_version == ''
        shell: pwsh
        run: |
          $sb = 'C:\Strawberry'
          foreach ($d in @("$sb\perl\site\bin", "$sb\perl\bin", "$sb\c\bin")) {
            Add-Content -Path $env:GITHUB_PATH -Value $d
          }

      #~ Fail fast if the active perl is still an MSYS/Cygwin build. A native
      #~ strawberry perl reports "MSWin32"; a Cygwin/MSYS perl reports "cygwin".
      #~ We only assert on Windows where the shadowing can happen.
      - name: Verify perl is native (not MSYS/Cygwin)
        if: runner.os == 'Windows' && matrix.perl_version == ''
        shell: pwsh
        run: |
          $os = & perl -e 'print $^O'
          Write-Host "perl \$^O = $os"
          $os = "$os".Trim()
          if ($os -ne 'MSWin32') {
            Write-Error "Active perl is '$os', expected 'MSWin32' (MSYS/Cygwin perl shadows Strawberry). Check PATH ordering."
            exit 1
          }

      #~ Strict cache key: every component that changes the produced binary
      #~ is in the key, so a hit always means "this exact perl". No loose
      #~ restore-keys — restoring a differently-configured build would be
      #~ worse than rebuilding.
      - name: Compute perl cache key
        if: matrix.perl_version != ''
        id: perlcache
        shell: bash
        run: |
          flags="${{ matrix.configure }}"
          flags="${flags// /_}"; flags="${flags//-/}"
          echo "suffix=${{ matrix.perl_version }}-${flags}" >> "$GITHUB_OUTPUT"

      - name: Cache source-built perl
        if: matrix.perl_version != ''
        uses: actions/cache@v6.1.0
        with:
          path: perl-dist
          key: perl-dist-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.perlcache.outputs.suffix }}

      - name: Build perl from source
        if: matrix.perl_version != ''
        shell: bash
        run: |
          set -e
          if [ -x "$(pwd)/perl-dist/bin/perl" ]; then
            echo "Using cached source-built perl from perl-dist"
            echo "$(pwd)/perl-dist/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          ver="${{ matrix.perl_version }}"
          prefix="$(pwd)/perl-dist"
          url="https://www.cpan.org/src/5.0/perl-${ver}.tar.gz"
          echo "Fetching ${url}"
          if command -v curl >/dev/null 2>&1; then
            curl -fL --retry 3 -o perl.tar.gz "${url}"
          elif command -v wget >/dev/null 2>&1; then
            wget -qO perl.tar.gz "${url}"
          else
            echo "curl or wget is required to download perl ${ver}" >&2
            exit 1
          fi
          rm -rf "perl-${ver}"
          gzip -dc perl.tar.gz | tar -xf -
          cd "perl-${ver}"
          MAKE=make
          command -v gmake >/dev/null 2>&1 && MAKE=gmake
          sh Configure -des "-Dprefix=${prefix}" -Dman1dir=none -Dman3dir=none ${{ matrix.configure }}
          "${MAKE}" -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          "${MAKE}" install
          #~ Sentinel: never report success without a built perl binary.
          [ -x "${prefix}/bin/perl" ]
          #~ Subsequent steps (task + info) resolve `perl` to the fresh build.
          echo "${prefix}/bin" >> "$GITHUB_PATH"

      - name: Run task
        shell: bash
        run: |
          #~ git-bash re-injects /usr/bin (MSYS2 perl) ahead of GITHUB_PATH, so
          #~ the env-level Strawberry prepend above is invisible to this shell.
          #~ Re-assert Strawberry first here so task's perl/cpanm/Build resolve
          #~ to it instead of the MSYS build (which lacks dual-life ExtUtils
          #~ modules). Only meaningful on Windows hosted runners.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
          fi
          ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      - name: Collect environment info
        if: always()
        id: info
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu*)       family='Linux' ;;
            macos*)        family='macOS' ;;
            windows*)      family='Windows' ;;
            freebsd)       family='FreeBSD' ;;
            openbsd)       family='OpenBSD' ;;
            netbsd)        family='NetBSD' ;;
            dragonflybsd)  family='DragonFly BSD' ;;
            solaris)       family='Solaris' ;;
            omnios)        family='OmniOS' ;;
            *)             family="${{ matrix.os }}" ;;
          esac
          case "${{ matrix.arch }}" in
            x86_64|amd64)  ashort='x64' ;;
            aarch64|arm64) ashort='a64' ;;
            riscv64)       ashort='r64' ;;
            *)             ashort="${{ matrix.arch }}" ;;
          esac
          pver="$(perl -e 'printf "%vd", $^V' 2>/dev/null || true)"
          if [ -n "$pver" ]; then
            pver="v$pver"
          fi
          echo "family=$family" >> "$GITHUB_OUTPUT"
          echo "arch_short=$ashort" >> "$GITHUB_OUTPUT"
          echo "perl=$pver" >> "$GITHUB_OUTPUT"

      #~ Local composite actions resolve against the caller repo when this
      #~ workflow is invoked cross-repo, so these steps stay inlined.
      - name: Record build status and metadata
        if: always()
        shell: bash
        run: |
          echo '${{ job.status }}' > "$FNAME.result"
          jq -n \
            --arg status '${{ job.status }}' \
            --arg platform '${{ matrix.platform_name }}' \
            --arg family '${{ steps.info.outputs.family }}' \
            --arg arch '${{ matrix.arch }}' \
            --arg ashort '${{ steps.info.outputs.arch_short }}' \
            --arg toolchain '${{ matrix.toolchain }}' \
            --arg perl '${{ steps.info.outputs.perl }}' \
            --arg variant '${{ matrix.variant }}' \
            '{status:$status,platform:$platform,family:$family,arch:$arch,arch_short:$ashort,toolchain:$toolchain,perl:$perl,variant:$variant}' \
            > "$FNAME.json"

      - name: Upload build status artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-artifact-${{ env.FNAME }}
          path: |
            ${{ env.FNAME }}.result
            ${{ env.FNAME }}.json
          retention-days: 1
