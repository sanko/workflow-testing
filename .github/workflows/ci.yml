name: CI w/ Coverage Tests

on:
  pull_request: ~
  push: ~
  schedule:
    - cron: '42 5 * * 0'
  workflow_dispatch: ~

permissions:
  contents: read
  # actions: read is required to list artifacts via the API
  actions: read

jobs:

  vm:
    name:  ${{ matrix.platform.os }}
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      platform_name: ${{ matrix.platform.os }}
      os: ${{ matrix.platform.os }}
      os_version: ${{ matrix.platform.version }}
      arch: ${{ matrix.arch }}
      prepare:  ${{ matrix.toolchain == 'clang' && matrix.platform.prepare_clang || matrix.platform.prepare_gcc }}
      host_os: 'ubuntu-latest'
      toolchain: ${{ matrix.compiler_cmd || matrix.toolchain }}
      task: 'perl -V'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: 'freebsd'
            version: '15.0'
            prepare_gcc:   'pkg install -y perl5 lang/gcc'
            prepare_clang: 'pkg install -y perl5 llvm'
          - os: 'openbsd'
            version: '7.8'
            #~ https://openbsd.app/
            prepare_gcc:   'pkg_add gcc-11.2.0p19 g++-11.2.0p19'
            prepare_clang: ''
          - os: 'netbsd'
            version: '10.1'
            prepare_gcc:   '/usr/sbin/pkg_add perl'
          - os: 'dragonflybsd'
            version: '6.4.0'
            prepare_gcc:   'pkg install -y perl5 gcc'
          - os: 'solaris'
            version: '11.4'
            prepare_gcc:   'pkg install -v --accept perl-538 gcc'
          - os: 'omnios'
            version: 'r151056'
            prepare_gcc:   'pkg install -v --accept perl build-essential'
        arch: ['x86_64', 'aarch64', 'riscv64']
        toolchain: ['gcc', 'clang']
        exclude:
          # Architecture exclusions
          - platform: { os: 'dragonflybsd' }
            arch: 'aarch64'
          - platform: { os: 'solaris' }
            arch: 'aarch64'
          - platform: { os: 'omnios' }
            arch: 'aarch64'
          - platform: { os: 'dragonflybsd' }
            arch: 'riscv64'
          # FreeBSD publishes no binary packages for riscv64 (Tier 2), so pkg(8)
          # cannot bootstrap on it; perl/gcc/llvm are only available via ports.
          - platform: { os: 'freebsd' }
            arch: 'riscv64'
          - platform: { os: 'netbsd' }
            arch: 'riscv64'
          - platform: { os: 'solaris' }
            arch: 'riscv64'
          - platform: { os: 'omnios' }
            arch: 'riscv64'
          # Toolchain exclusions for simplicity
          - platform: { os: 'netbsd' }
            toolchain: 'clang'
          - platform: { os: 'dragonflybsd' }
            toolchain: 'clang'
          - platform: { os: 'solaris' }
            toolchain: 'clang'
          - platform: { os: 'omnios' }
            toolchain: 'clang'
        include:
          # Use specific 'egcc' command for packaged GCC on OpenBSD
          - platform: { os: 'openbsd' }
            toolchain: 'gcc'
            compiler_cmd: 'egcc'

  direct:
    name: ${{ matrix.platform.name }}-${{ matrix.platform.arch }}
    uses: ./.github/workflows/run-direct.yml
    secrets: inherit
    with:
      platform_name: ${{ matrix.platform.name }}
      os: ${{ matrix.platform.os }}
      arch: ${{ matrix.platform.arch }}
      prepare: ${{ (matrix.toolchain == 'clang' && matrix.platform.prepare_clang) || (matrix.toolchain == 'msvc' && matrix.platform.prepare_msvc) || matrix.platform.prepare_gcc }}
      toolchain: ${{ matrix.toolchain }}
      task: 'perl -V'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: 'ubuntu'
            os: 'ubuntu-latest'
            arch: 'x86_64'
            prepare_gcc: 'sudo apt-get update && sudo apt-get install -y gcc perl'
            prepare_clang: 'sudo apt-get update && sudo apt-get install -y clang perl'
          - name: 'macos'
            os: 'macos-15'
            arch: 'aarch64'
            prepare_gcc: ''
            prepare_clang: ''
          - name: 'macos'
            os: 'macos-15-intel'
            arch: 'x86_64'
            prepare_gcc: ''
            prepare_clang: ''
          - name: 'windows'
            os: 'windows-latest'
            arch: 'x86_64'
            # Setup Strawberry Perl so the task can invoke perl under bash
            prepare_gcc: 'choco install mingw strawberryperl'
            prepare_clang: 'choco install llvm strawberryperl'
            prepare_msvc: 'choco install opencppcoverage strawberryperl; bash'
          - name: 'ubuntu'
            os: 'ubuntu-24.04-arm'
            arch: 'aarch64'
            prepare_gcc: 'sudo apt-get update && sudo apt-get install -y gcc perl'
            prepare_clang: 'sudo apt-get update && sudo apt-get install -y clang perl'
          - name: 'windows'
            os: 'windows-11-arm'
            arch: 'aarch64'
            prepare_gcc: ''
            prepare_clang: 'choco install llvm strawberryperl'
            prepare_msvc: 'choco install opencppcoverage strawberryperl; bash'
          - name: 'ubuntu'
            os: 'ubuntu-24.04-riscv'
            arch: 'riscv64'
            prepare_gcc: 'sudo apt-get update && sudo apt-get install -y gcc perl'
            # libclang-rt-dev provides libclang_rt.profile-riscv64.a, which clang's
            # --coverage link step needs on RISC-V (not pulled in by `clang` alone).
            prepare_clang: 'sudo apt-get update && sudo apt-get install -y clang perl libclang-rt-dev'
        toolchain: ['gcc', 'clang', 'msvc']
        exclude:
          #~ - platform: { name: 'macos' }
            #~ toolchain: 'gcc'
          - platform: { name: 'ubuntu' }
            toolchain: 'msvc'
          - platform: { name: 'macos' }
            toolchain: 'msvc'

  results:
    name: Summary
    if: always()
    needs: [vm, direct]
    uses: ./.github/workflows/results-summary.yml
  publish-status:
    name: Publish Status Page
    if: ( success() || failure() ) && github.ref == 'refs/heads/main' # Only run on pushes to the main branch
    needs: [results]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Permission to write to the repo (for gh-pages branch)
    steps:
      - name: Download status files
        #~ if: success() || failure()
        uses: actions/download-artifact@v8.0.1
        with:
          name: status-files
          path: ./status

      - name: Deploy to GitHub Pages
        #~ if: success() || failure()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./status
          publish_branch: gh-pages
          keep_files: true
          destination_dir: status
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update build status matrix'
