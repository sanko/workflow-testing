name: CI w/ Coverage Tests

on:
  pull_request: ~
  push: ~
  schedule:
    - cron: '42 5 * * 0'
  #~ Manual runs may carry the same selectors as a commit tag. These win over
  #~ whatever the commit message says.
  workflow_dispatch:
    inputs:
      runner:
        default: all
        description: 'Runners to execute, comma-separated (e.g. "freebsd,linux" or "linux#arm,openbsd#riscv"). See the [runner:...] tag below.'
        type: string
      test_files:
        default: ''
        description: 'Test file pattern to run (e.g. t/3000_jenny/3500_isolate/*.t). See the [test:...] tag below.'
        type: string
      feed:
        default: ''
        description: 'Machine-readable result feeds to emit alongside the tables: "json", "rss", or "json,rss". See the [feed:...] tag below.'
        type: string

permissions:
  contents: read
  # actions: read is required to list artifacts via the API
  actions: read

jobs:

  #~ Commit message filtering.
  #~
  #~ A commit message (or, for pull requests, the PR title) may carry two tags:
  #~
  #~   [runner:freebsd,linux#arm]      only these OS families run
  #~   [test:t/3000_jenny/*.t]         only this test pattern runs
  #~   [feed:json,rss]                 also publish machine-readable feeds
  #~
  #~ `runner` takes a comma-separated list of family names, each optionally
  #~ suffixed with `#<arch>` to run only the setups built for that
  #~ architecture; without the suffix every setup in that family runs. `all`
  #~ (the default) runs everything, so an untagged commit behaves exactly like
  #~ a full run.
  #~
  #~ Selection lives in the reusable generate-matrix.yml, so downstream repos can
  #~ call it directly instead of copying the ~250 lines of tag parsing and jq
  #~ pruning that used to sit here. The setup table travels with that workflow,
  #~ so nothing has to be added to this repo's checkout, and nothing has to be
  #~ added to a caller's repo either.
  #
  #~ It emits:
  #~
  #~   runner    space-padded list of families the tag named, for the report
  #~   ready     subset of those with at least one setup left, padded the same
  #~             way, so each job below gates on it with contains()
  #~   matrices  pruned matrix per family, keyed by family name
  setup:
    name: Generate Testing Matrix
    uses: ./.github/workflows/generate-matrix.yml
    with:
      #~ Dispatch inputs win over the commit tag; empty means "no override",
      #~ which is what leaves an untagged commit running everything.
      runner: '${{ github.event.inputs.runner }}'
      test_files: '${{ github.event.inputs.test_files }}'
      feed: '${{ github.event.inputs.feed }}'

  #~ Every family below is gated on its own name appearing in the padded `ready`
  #~ list, which generate-matrix.yml builds after applying both the family and
  #~ the arch filter. A family with no surviving setup is absent from `ready`, so
  #~ an empty matrix is never handed to a reusable workflow.

  freebsd:
    name: FreeBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' freebsd ') }}"
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      os_version: '15.0'
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).freebsd) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  openbsd:
    name: OpenBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' openbsd ') }}"
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      os_version: '7.8'
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).openbsd) }}
      test_files: "${{ needs.setup.outputs.test_files }}"
      #~ https://openbsd.app/

  netbsd:
    name: NetBSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' netbsd ') }}"
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      os_version: '10.1'
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).netbsd) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  dragonflybsd:
    name: DragonFly BSD
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' dragonflybsd ') }}"
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      os_version: '6.4.0'
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).dragonflybsd) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  solaris:
    name: Solaris
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' solaris ') }}"
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      os_version: '11.4'
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).solaris) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  omnios:
    name: OmniOS
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' omnios ') }}"
    uses: ./.github/workflows/run-vm.yml
    secrets: inherit
    with:
      os_version: 'r151056'
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).omnios) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  linux:
    name: Linux
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' linux ') }}"
    uses: ./.github/workflows/run-direct.yml
    secrets: inherit
    with:
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).linux) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  macos:
    name: macOS
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' macos ') }}"
    uses: ./.github/workflows/run-direct.yml
    secrets: inherit
    with:
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).macos) }}
      test_files: "${{ needs.setup.outputs.test_files }}"

  windows:
    name: Windows
    needs: setup
    if: "${{ contains(needs.setup.outputs.ready, ' windows ') }}"
    uses: ./.github/workflows/run-direct.yml
    secrets: inherit
    with:
      task: 'perl -V'
      matrix: ${{ toJSON(fromJSON(needs.setup.outputs.matrices).windows) }}
      test_files: "${{ needs.setup.outputs.test_files }}"
      # Setup Strawberry Perl so the task can invoke perl under bash

  results:
    name: Summary
    if: always()
    needs: [setup, freebsd, openbsd, netbsd, dragonflybsd, solaris, omnios, linux, macos, windows]
    uses: ./.github/workflows/results-summary.yml
    with:
      #~ Lets the report distinguish "this family was filtered out of the run"
      #~ from "this family was selected and produced nothing".
      runner: "${{ needs.setup.outputs.runner }}"
      test_files: "${{ needs.setup.outputs.test_files }}"
      feed: "${{ needs.setup.outputs.feed }}"

  publish-status:
    name: Publish Status Page
    if: ( success() || failure() ) && github.ref == 'refs/heads/main' # Only run on pushes to the main branch
    needs: [results]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Permission to write to the repo (for gh-pages branch)
    steps:
      - name: Download status files
        #~ if: success() || failure()
        uses: actions/download-artifact@v8.0.1
        with:
          name: status-files
          path: ./status

      - name: Deploy to GitHub Pages
        #~ if: success() || failure()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./status
          publish_branch: gh-pages
          keep_files: true
          destination_dir: status
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Update build status matrix'
