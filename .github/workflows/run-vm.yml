name: Run Task in VM

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      matrix:
        description: >
          JSON array of setups for this OS family. Item fields:
          platform_name (required), os (required), arch (required).
          Optional fields: name (overrides the auto-generated job name),
          toolchain, prepare, variant, perl_version, configure. The os
          selects the VM image.
        required: true
        type: string
      os_version:
        description: 'Release/version forwarded to vmactions'
        required: false
        type: string
      host_os:
        description: 'Runner label hosting the VM (defaults to ubuntu-latest)'
        required: false
        type: string
      task:
        description: >
          Command(s) executed inside the VM. Defaults to the standard
          coverage build when omitted. Applies to every setup in the matrix.
        required: false
        type: string
      checkout_submodules:
        description: >
          Fetch submodules during checkout. Set to 'recursive' to include
          nested submodules. Empty (the default) fetches none.
        required: false
        type: string
        default: ''
      continue_on_error:
        description: >
          Report failed matrix entries without failing the caller's run.
          Experimental legs stay visible in their own jobs while the
          calling workflow reads green. Defaults off.
        required: false
        type: boolean
        default: false

jobs:
  run:
    continue-on-error: ${{ inputs.continue_on_error }}
    name: ${{ matrix.name || format('{0}-{1}{2}{3}', (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'a64') || (matrix.arch == 'riscv64' && 'r64') || matrix.arch, matrix.toolchain, matrix.perl_version && format('-v{0}', matrix.perl_version) || '', matrix.variant && format('-{0}', matrix.variant) || '') }}
    runs-on: ${{ inputs.host_os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      #~ Token for the GitHub API so release lookups bypass the anonymous
      #~ 60 req/hr rate limit. The builder's HTTP::Tiny sends it as an
      #~ Authorization: Bearer header when GITHUB_TOKEN is set.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #~ Raw user-defined name (may contain spaces/slashes); used only to
      #~ compute the filesystem-safe FNAME below.
      RAW_NAME: ${{ matrix.name || '' }}
      #~ Deterministic identity for this matrix entry, hashed (with python)
      #~ in the fingerprint step so every distinct setup gets a unique,
      #~ reproducible id even when arch/toolchain/perl are identical.
      IDENTITY: >-
        ${{ matrix.platform_name }}|${{ matrix.os }}|${{ matrix.arch }}|
        ${{ matrix.toolchain }}|${{ matrix.perl_version }}|${{ matrix.variant }}|
        ${{ matrix.configure }}|${{ matrix.prepare }}|${{ matrix.name }}
      #~ Base name for this setup's result files.  Overridden below with
      #~ `<sanitised-name>-<base>-<hash>` (hash is always appended).
      FNAME: ${{ matrix.platform_name }}-${{ matrix.arch }}-${{ matrix.toolchain }}${{ matrix.perl_version && format('-v{0}', matrix.perl_version) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0
        with:
          submodules: ${{ inputs.checkout_submodules }}

      - name: Compute unique build fingerprint
        shell: bash
        run: |
          #~ Hash every field of the matrix entry so distinct setups never
          #~ collide, even when arch/toolchain/perl versions are identical.
          if command -v python3 >/dev/null 2>&1; then
            id=$(printf '%s' "$IDENTITY" | python3 -c 'import sys,hashlib;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:8])')
          elif command -v python >/dev/null 2>&1; then
            id=$(printf '%s' "$IDENTITY" | python -c 'import sys,hashlib;print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:8])')
          else
            id=$(printf '%s' "$IDENTITY" | perl -MDigest::SHA=sha256_hex -e 'print substr(sha256_hex(<STDIN>),0,8)')
          fi
          echo "JOBID=${id}" >> "$GITHUB_ENV"
          #~ Spaces and forward slashes are the most common problematic
          #~ characters in human-readable names; replace them with hyphens
          #~ so the result is safe for filenames and artifact names.
          fname="$FNAME"
          if [ -n "$RAW_NAME" ]; then
            safe=$(printf '%s' "$RAW_NAME" | tr ' /' '-')
            fname="${safe}-${fname}"
          fi
          echo "FNAME=${fname}-${id}" >> "$GITHUB_ENV"

      #~ Strict cache key: every component that changes the produced binary
      #~ is in the key, so a hit always means "this exact perl". No loose
      #~ restore-keys: restoring a differently-configured build would be
      #~ worse than rebuilding. The VM syncs perl-dist in before its run
      #~ blocks and back out afterwards, so host-side caching just works.
      - name: Compute perl cache key
        if: matrix.perl_version != ''
        id: perlcache
        shell: bash
        run: |
          flags="${{ matrix.configure }}"
          flags="${flags// /_}"; flags="${flags//-/}"
          echo "suffix=${{ matrix.perl_version }}-${flags}" >> "$GITHUB_OUTPUT"

      - name: Cache source-built perl
        if: matrix.perl_version != ''
        uses: actions/cache@v6.1.0
        with:
          path: perl-dist
          key: perl-dist-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.perlcache.outputs.suffix }}

      #~ Written on the host, sourced inside the VM run blocks below (local
      #~ composite actions cannot be used cross-repo, so this is a file).
      - name: Write perl build helper
        shell: bash
        run: |
          cat > .ci-build-perl.sh <<'EOF'
          #~ Fetch, configure, build and install perl into ./perl-dist.
          #~ Usage: ci_build_perl <full-version> [extra ./Configure flags...]
          ci_build_perl() {
            ver="$1"; shift
            start="$(pwd)"
            prefix="$(pwd)/perl-dist"
            url="https://www.cpan.org/src/5.0/perl-${ver}.tar.gz"
            echo "Fetching ${url}"
            #~ No bare `set -e` here: a silent subshell exit turns a failed
            #~ configure/make into a mysteriously empty log. Every stage
            #~ reports its own explicit failure instead, so a broken build
            #~ always names the step (and exit code) that died.
            download() {
              if command -v curl >/dev/null 2>&1; then curl -fL --retry 3 -o perl.tar.gz "${url}"
              elif command -v wget >/dev/null 2>&1; then wget -qO perl.tar.gz "${url}"
              elif command -v fetch >/dev/null 2>&1; then fetch -o perl.tar.gz "${url}"
              else ftp -o perl.tar.gz "${url}"
              fi
            }
            download "${url}"
            rc=$?
            [ "$rc" -eq 0 ] || { echo "!! ci_build_perl: fetching ${url} failed (exit ${rc})" >&2; exit 1; }
            rm -rf "perl-${ver}"
            gzip -dc perl.tar.gz > "perl-${ver}.tar"
            rc=$?
            [ "$rc" -eq 0 ] || { echo "!! ci_build_perl: gunzip perl.tar.gz failed (exit ${rc})" >&2; exit 1; }
            tar -xf "perl-${ver}.tar"
            rc=$?
            [ "$rc" -eq 0 ] || { echo "!! ci_build_perl: extracting perl-${ver}.tar failed (exit ${rc})" >&2; exit 1; }
            rm -f "perl-${ver}.tar"
            cd "perl-${ver}" || { echo "!! ci_build_perl: cannot cd into perl-${ver}" >&2; exit 1; }
            MAKE=make
            command -v gmake >/dev/null 2>&1 && MAKE=gmake
            echo "== configuring perl-${ver} (make=${MAKE}, extra flags: $*)"
            sh Configure -des "-Dprefix=${prefix}" -Dman1dir=none -Dman3dir=none "$@"
            rc=$?
            [ "$rc" -eq 0 ] || { echo "!! ci_build_perl: Configure FAILED (exit ${rc})" >&2; exit 1; }
            echo "== Configure OK; building (serial, see jobserver comment below)"
            #~ Build perl serially. perl's source build recurses into
            #~ per-module subdirs whose nested make picks up gmake 4.4's
            #~ --jobserver-auth token from MAKEFLAGS and mis-parses it as
            #~ "-j observer-auth=..." , aborting with "argument ... to option
            #~ '-j' must be a positive number" on FreeBSD/other *BSD (the
            #~ nested make is the OS/bundled make, not gmake). Any -jN spawns
            #~ the jobserver, so the only reliable fix is a serial build. It
            #~ is a one-time cost: the result is cached in perl-dist.
            "${MAKE}"
            rc=$?
            [ "$rc" -eq 0 ] || { echo "!! ci_build_perl: make FAILED (exit ${rc})" >&2; exit 1; }
            echo "== make OK; installing to ${prefix}"
            "${MAKE}" install
            rc=$?
            [ "$rc" -eq 0 ] || { echo "!! ci_build_perl: make install FAILED (exit ${rc})" >&2; exit 1; }
            #~ Sentinel: never report success without a built perl binary.
            if [ ! -x "${prefix}/bin/perl" ]; then
              echo "!! ci_build_perl: ${prefix}/bin/perl missing after install" >&2
              exit 1
            fi
            #~ Leave the build tree: the caller's task runs from the workspace
            #~ root, and a leftover cwd inside perl-${ver} made `cpanm .`
            #~ configure perl's own source instead of the module under test.
            cd "${start}" || { echo "!! ci_build_perl: cannot cd back to ${start}" >&2; exit 1; }
            echo "== perl-${ver} built and installed OK"
          }
          EOF

      - name: Build and Test in FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}
            #~ Surface any in-VM crash report even when the task failed.
            cat /tmp/parataxis-crash.log 2>/dev/null || true

      - name: Build and Test in OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}
            #~ Surface any in-VM crash report even when the task failed.
            cat /tmp/parataxis-crash.log 2>/dev/null || true

      - name: Build and Test in NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}
            #~ Surface any in-VM crash report even when the task failed.
            cat /tmp/parataxis-crash.log 2>/dev/null || true

      - name: Build and Test in DragonflyBSD
        if: matrix.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@v1.3.1
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}
            #~ Surface any in-VM crash report even when the task failed.
            cat /tmp/parataxis-crash.log 2>/dev/null || true

      - name: Build and Test in Solaris
        if: matrix.os == 'solaris'
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}
            #~ Surface any in-VM crash report even when the task failed.
            cat /tmp/parataxis-crash.log 2>/dev/null || true

      - name: Build and Test in OmniOS
        if: matrix.os == 'omnios'
        uses: vmactions/omnios-vm@v1.3.4
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
