name: Run Task in VM

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      os:
        required: true
        type: string
      os_version:
        required: false
        type: string
      arch:
        required: true
        type: string
      prepare:
        required: false
        type: string
      host_os:
        description: 'Runner label hosting the VM (defaults to ubuntu-latest)'
        required: false
        type: string
      toolchain:
        required: true
        type: string
      task:
        description: 'Command(s) to execute inside the VM'
        required: true
        type: string

jobs:
  run:
    name: ${{ inputs.os }}-${{ inputs.arch }}-${{ inputs.toolchain }}
    runs-on: ${{ inputs.host_os || 'ubuntu-latest' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      - name: Build and Test in FreeBSD
        if: inputs.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: ${{ inputs.task }}

      - name: Build and Test in OpenBSD
        if: inputs.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: ${{ inputs.task }}

      - name: Build and Test in NetBSD
        if: inputs.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: ${{ inputs.task }}

      - name: Build and Test in DragonflyBSD
        if: inputs.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@v1.3.1
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: ${{ inputs.task }}

      - name: Build and Test in Solaris
        if: inputs.os == 'solaris'
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: ${{ inputs.task }}

      - name: Build and Test in OmniOS
        if: inputs.os == 'omnios'
        uses: vmactions/omnios-vm@v1.3.4
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: ${{ inputs.task }}

      #~ - name: Upload coverage reports to Codecov
        #~ uses: codecov/codecov-action@v5
        #~ with:
          #~ token: ${{ secrets.CODECOV_TOKEN }}
          #~ root_dir: src
          #~ flags: ${{inputs.os}}, ${{inputs.arch}}, ${{ inputs.toolchain }}
          #~ name: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          #~ verbose: true

      #~ Local composite actions resolve against the caller repo when this
      #~ workflow is invoked cross-repo, so these steps stay inlined.
      - name: Record build status
        if: always()
        shell: bash
        run: echo '${{ job.status }}' > '${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result'

      - name: Upload build status artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-artifact-${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          path: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result
          retention-days: 1
