name: Run Task in VM

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      matrix:
        description: >
          JSON array of setups for this OS family. Item fields:
          platform_name (required), os (required), arch (required),
          toolchain, prepare, variant, perl_version, configure. The os
          selects the VM image.
        required: true
        type: string
      os_version:
        description: 'Release/version forwarded to vmactions'
        required: false
        type: string
      host_os:
        description: 'Runner label hosting the VM (defaults to ubuntu-latest)'
        required: false
        type: string
      task:
        description: >
          Command(s) executed inside the VM. Defaults to the standard
          coverage build when omitted. Applies to every setup in the matrix.
        required: false
        type: string

jobs:
  run:
    name: ${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'a64') || (matrix.arch == 'riscv64' && 'r64') || matrix.arch }}-${{ matrix.toolchain }}${{ matrix.perl_version && format('-v{0}', matrix.perl_version) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    runs-on: ${{ inputs.host_os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      #~ Unique base name for this setup's result files
      FNAME: ${{ matrix.platform_name }}-${{ matrix.arch }}-${{ matrix.toolchain }}${{ matrix.perl_version && format('-v{0}', matrix.perl_version) || '' }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      #~ Strict cache key: every component that changes the produced binary
      #~ is in the key, so a hit always means "this exact perl". No loose
      #~ restore-keys — restoring a differently-configured build would be
      #~ worse than rebuilding. The VM syncs perl-dist in before its run
      #~ blocks and back out afterwards, so host-side caching just works.
      - name: Compute perl cache key
        if: matrix.perl_version != ''
        id: perlcache
        shell: bash
        run: |
          flags="${{ matrix.configure }}"
          flags="${flags// /_}"; flags="${flags//-/}"
          echo "suffix=${{ matrix.perl_version }}-${flags}" >> "$GITHUB_OUTPUT"

      - name: Cache source-built perl
        if: matrix.perl_version != ''
        uses: actions/cache@v6.1.0
        with:
          path: perl-dist
          key: perl-dist-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.toolchain }}-${{ steps.perlcache.outputs.suffix }}

      #~ Written on the host, sourced inside the VM run blocks below (local
      #~ composite actions cannot be used cross-repo, so this is a file).
      - name: Write perl build helper
        shell: bash
        run: |
          cat > .ci-build-perl.sh <<'EOF'
          #~ Fetch, configure, build and install perl into ./perl-dist.
          #~ Usage: ci_build_perl <full-version> [extra ./Configure flags...]
          ci_build_perl() {
            ver="$1"; shift
            prefix="$(pwd)/perl-dist"
            url="https://www.cpan.org/src/5.0/perl-${ver}.tar.gz"
            echo "Fetching ${url}"
            (
              set -e
              if command -v curl >/dev/null 2>&1; then
                curl -fL --retry 3 -o perl.tar.gz "${url}"
              elif command -v wget >/dev/null 2>&1; then
                wget -qO perl.tar.gz "${url}"
              elif command -v fetch >/dev/null 2>&1; then
                fetch -o perl.tar.gz "${url}"
              else
                ftp -o perl.tar.gz "${url}"
              fi
              rm -rf "perl-${ver}"
              gzip -dc perl.tar.gz | tar -xf -
              cd "perl-${ver}"
              MAKE=make
              command -v gmake >/dev/null 2>&1 && MAKE=gmake
              sh Configure -des "-Dprefix=${prefix}" -Dman1dir=none -Dman3dir=none "$@"
              #~ Force the pre-4.4 pipe jobserver: gmake 4.4 defaults to a
              #~ fifo-based --jobserver-auth=fifo:... token that perl's nested
              #~ sub-makes (via the OS make, not gmake) mis-parse as
              #~ "-j observer-auth=fifo:..." and abort with "argument ... to
              #~ option '-j' must be a positive number" on FreeBSD/other *BSD.
              "${MAKE}" --jobserver-style=pipe -j"$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
              "${MAKE}" install
              #~ Sentinel: never report success without a built perl binary.
              [ -x "${prefix}/bin/perl" ]
            )
          }
          EOF

      - name: Build and Test in FreeBSD
        if: matrix.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      - name: Build and Test in OpenBSD
        if: matrix.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      - name: Build and Test in NetBSD
        if: matrix.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      - name: Build and Test in DragonflyBSD
        if: matrix.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@v1.3.1
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      - name: Build and Test in Solaris
        if: matrix.os == 'solaris'
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      - name: Build and Test in OmniOS
        if: matrix.os == 'omnios'
        uses: vmactions/omnios-vm@v1.3.4
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ matrix.arch }}
          prepare: ${{ matrix.prepare }}
          run: |
            #~ Build perl from source when the setup requests it. The shared
            #~ workspace syncs .perl-version back to the host info step.
            if [ -n '${{ matrix.perl_version }}' ]; then
              if [ ! -x "$(pwd)/perl-dist/bin/perl" ]; then
                . ./.ci-build-perl.sh
                #~ Plain call + explicit status check: invoking the function
                #~ inside `||`/`if` would suppress errexit inside it.
                ci_build_perl '${{ matrix.perl_version }}' ${{ matrix.configure }}
                status=$?
                [ "$status" -eq 0 ] || exit 1
              else
                echo "Using cached source-built perl from perl-dist"
              fi
              PATH="$(pwd)/perl-dist/bin:$PATH"
            fi
            #~ Capture the perl version inside the VM for the host info step.
            perl -e 'printf "%vd", $^V' > .perl-version 2>/dev/null || true
            ${{ inputs.task || format('perl build.pl --compiler={0} coverage', matrix.toolchain) }}

      #~ - name: Upload coverage reports to Codecov
        #~ uses: codecov/codecov-action@v5
        #~ with:
          #~ token: ${{ secrets.CODECOV_TOKEN }}
          #~ root_dir: src
          #~ flags: ${{inputs.os}}, ${{inputs.arch}}, ${{ inputs.toolchain }}
          #~ name: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          #~ verbose: true

      - name: Collect environment info
        if: always()
        id: info
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            freebsd)       family='FreeBSD' ;;
            openbsd)       family='OpenBSD' ;;
            netbsd)        family='NetBSD' ;;
            dragonflybsd)  family='DragonFly BSD' ;;
            solaris)       family='Solaris' ;;
            omnios)        family='OmniOS' ;;
            *)             family="${{ matrix.os }}" ;;
          esac
          case "${{ matrix.arch }}" in
            x86_64|amd64)  ashort='x64' ;;
            aarch64|arm64) ashort='a64' ;;
            riscv64)       ashort='r64' ;;
            *)             ashort="${{ matrix.arch }}" ;;
          esac
          #~ .perl-version is written inside the VM (see the run steps above);
          #~ fall back to a host perl for anything else.
          if [ -f .perl-version ]; then
            pver="$(cat .perl-version)"
            rm -f .perl-version
          else
            pver="$(perl -e 'printf "%vd", $^V' 2>/dev/null || true)"
          fi
          if [ -n "$pver" ]; then
            pver="v$pver"
          fi
          echo "family=$family" >> "$GITHUB_OUTPUT"
          echo "arch_short=$ashort" >> "$GITHUB_OUTPUT"
          echo "perl=$pver" >> "$GITHUB_OUTPUT"

      #~ Local composite actions resolve against the caller repo when this
      #~ workflow is invoked cross-repo, so these steps stay inlined.
      - name: Record build status and metadata
        if: always()
        shell: bash
        run: |
          echo '${{ job.status }}' > "$FNAME.result"
          jq -n \
            --arg status '${{ job.status }}' \
            --arg platform '${{ matrix.platform_name }}' \
            --arg family '${{ steps.info.outputs.family }}' \
            --arg arch '${{ matrix.arch }}' \
            --arg ashort '${{ steps.info.outputs.arch_short }}' \
            --arg toolchain '${{ matrix.toolchain }}' \
            --arg perl '${{ steps.info.outputs.perl }}' \
            --arg variant '${{ matrix.variant }}' \
            '{status:$status,platform:$platform,family:$family,arch:$arch,arch_short:$ashort,toolchain:$toolchain,perl:$perl,variant:$variant}' \
            > "$FNAME.json"

      - name: Upload build status artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-artifact-${{ env.FNAME }}
          path: |
            ${{ env.FNAME }}.result
            ${{ env.FNAME }}.json
          retention-days: 1
